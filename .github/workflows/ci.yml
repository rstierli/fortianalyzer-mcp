name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv venv
          uv sync --all-extras

      - name: Run linting
        run: |
          uv run ruff check src/

      - name: Run tests
        env:
          FORTIANALYZER_HOST: "ci-dummy.local"
        run: |
          uv run pytest tests/ --ignore=tests/integration -v --tb=short

      - name: Run tests with coverage
        env:
          FORTIANALYZER_HOST: "ci-dummy.local"
        run: |
          uv run pytest tests/ --ignore=tests/integration --cov=src/fortianalyzer_mcp --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv venv
          uv sync --all-extras

      - name: Check formatting
        run: |
          uv run ruff format --check src/ tests/

      - name: Check linting
        run: |
          uv run ruff check src/ tests/

      - name: Check types
        run: |
          uv run mypy src/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv venv
          uv sync --all-extras

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          uv run --with pip-audit -- pip-audit --desc

      - name: Static security analysis (bandit)
        run: |
          uv run --with bandit -- bandit -r src/ -ll -ii
